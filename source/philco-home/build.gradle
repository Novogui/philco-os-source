plugins {
    id 'com.android.application' version '8.7.3'
}

def localSigning = new Properties()
def signingFile = rootProject.file('../../.toolchain/signing.properties')
if (signingFile.isFile()) signingFile.withInputStream { localSigning.load(it) }

android {
    namespace 'com.philco.ultra777.home'
    compileSdk 35
    buildToolsVersion '35.0.0'

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }

    defaultConfig {
        applicationId 'com.philco.ultra777.home'
        minSdk 19
        targetSdk 19
        versionCode 7778
        versionName '1.0.0-ultra777'
        ndk { abiFilters 'armeabi-v7a' }
    }

    signingConfigs {
        release {
            storeFile file(localSigning.getProperty('storeFile', 'C:/PhilcoOS/.toolchain/philco-release.jks'))
            storePassword localSigning.getProperty('storePassword', '')
            keyAlias localSigning.getProperty('keyAlias', 'philco_ultra777')
            keyPassword localSigning.getProperty('keyPassword', '')
            enableV1Signing true
            enableV2Signing false
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        // API 19 targeting is deliberate for the offline KitKat television.
        disable 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    // Android 4.4's bundled TLS stack can no longer negotiate with the weather API.
    // KitKat-compatible Conscrypt keeps certificate and hostname verification enabled.
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
}
