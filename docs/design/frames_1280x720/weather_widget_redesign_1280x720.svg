<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <!-- 1. Background Wallpaper Simulation (Sunset Alpine Glow matching wallpaper_01) -->
    <linearGradient id="skyGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#3D2B1F"/>
      <stop offset="35%" stop-color="#C78434"/>
      <stop offset="60%" stop-color="#E29F44"/>
      <stop offset="78%" stop-color="#E8A749"/>
      <stop offset="90%" stop-color="#6E4422"/>
      <stop offset="100%" stop-color="#1E140C"/>
    </linearGradient>

    <radialGradient id="sunBloom" cx="50%" cy="68%" r="45%">
      <stop offset="0%" stop-color="#FFF2D6" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#FDB953" stop-opacity="0.75"/>
      <stop offset="55%" stop-color="#DE8C32" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#B86A20" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass Material: Dark Charcoal-Navy 80% Opacity (Zero Wallpaper Bleed) -->
    <linearGradient id="weatherGlassDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142134" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0A111C" stop-opacity="0.86"/>
    </linearGradient>

    <!-- Frosted Rim Border -->
    <linearGradient id="frostedBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>

    <!-- Discrete Vertical Divider -->
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Dock Tile Glass Materials -->
    <linearGradient id="dockTileGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B2636" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#0E1624" stop-opacity="0.84"/>
    </linearGradient>

    <linearGradient id="dockTileFocused" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22334A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#142032" stop-opacity="0.90"/>
    </linearGradient>

    <!-- Action Button Glass Material -->
    <linearGradient id="btnGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2A3B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#101824" stop-opacity="0.80"/>
    </linearGradient>

    <!-- Vignette Shadow Overlay (Safe Area Dimming) -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="45%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.60"/>
    </radialGradient>

    <!-- Text Drop Shadow for 10-Foot Legibility -->
    <filter id="textDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00E5FF" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 1. Wallpaper Layer -->
  <rect width="1280" height="720" fill="url(#skyGrad)"/>
  <rect width="1280" height="720" fill="url(#sunBloom)"/>

  <!-- Silhouette Figures (Shepherd & Lamb Silhouette) -->
  <path d="M 470,220 C 475,200 515,200 520,220 C 530,240 550,290 555,340 C 560,390 570,440 560,510 C 555,530 540,560 535,590 L 460,590 C 455,550 440,510 445,460 C 448,410 435,330 445,280 C 450,250 465,230 470,220 Z" fill="#2B1A10" fill-opacity="0.95"/>
  <path d="M 390,320 L 415,590" stroke="#3D2817" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Little Lamb Silhouette -->
  <ellipse cx="615" cy="545" rx="30" ry="20" fill="#2B1A10" fill-opacity="0.95"/>
  <circle cx="638" cy="530" r="12" fill="#2B1A10" fill-opacity="0.95"/>
  <!-- Horizon Ridge -->
  <path d="M 0,560 Q 400,530 750,560 T 1280,550 L 1280,720 L 0,720 Z" fill="#1A110A"/>

  <!-- Vignette -->
  <rect width="1280" height="720" fill="url(#vignette)"/>

  <!-- ========================================================================= -->
  <!-- 2. UPPER HEADER AREA (Left: Clock & Date | Right: Actions, Status, Weather)-->
  <!-- ========================================================================= -->

  <!-- Left: Digital Clock & Date (X: 64, Y: 120..220) -->
  <g transform="translate(64, 110)">
    <text x="0" y="80" font-family="Roboto, sans-serif" font-weight="400" font-size="94" fill="#FFFFFF" letter-spacing="-1" filter="url(#textDropShadow)">19:54</text>
    <text x="8" y="122" font-family="Roboto, sans-serif" font-weight="400" font-size="20" fill="#F3F6FC" letter-spacing="0.2" filter="url(#textDropShadow)">Sábado • 21/11/2026</text>
  </g>

  <!-- Right: Action Buttons Row (X: 868..1216, Y: 28..66) -->
  <g transform="translate(868, 28)">
    <!-- Button: Paisagens -->
    <g transform="translate(0, 0)">
      <rect width="108" height="36" rx="14" fill="url(#btnGlass)" stroke="#70E6CF" stroke-opacity="0.45" stroke-width="1"/>
      <!-- Photo Icon -->
      <rect x="12" y="11" width="16" height="14" rx="2" fill="none" stroke="#70E6CF" stroke-width="1.6"/>
      <circle cx="16" cy="15" r="1.8" fill="#70E6CF"/>
      <path d="M 12,22 L 18,17 L 24,22" stroke="#70E6CF" stroke-width="1.4" fill="none"/>
      <text x="35" y="23" font-family="Roboto, sans-serif" font-weight="500" font-size="13" fill="#FFFFFF">Paisagens</text>
    </g>

    <!-- Button: Ajustes -->
    <g transform="translate(116, 0)">
      <rect width="94" height="36" rx="14" fill="url(#btnGlass)" stroke="#F0D693" stroke-opacity="0.45" stroke-width="1"/>
      <circle cx="20" cy="18" r="6" fill="none" stroke="#F0D693" stroke-width="1.6"/>
      <text x="35" y="23" font-family="Roboto, sans-serif" font-weight="500" font-size="13" fill="#FFFFFF">Ajustes</text>
    </g>

    <!-- Button: Standby -->
    <g transform="translate(218, 0)">
      <rect width="102" height="36" rx="14" fill="url(#btnGlass)" stroke="#9CCBFF" stroke-opacity="0.45" stroke-width="1"/>
      <path d="M 20,11 L 20,17 M 15,14 A 7,7 0 1,0 25,14" fill="none" stroke="#9CCBFF" stroke-width="1.8" stroke-linecap="round"/>
      <text x="35" y="23" font-family="Roboto, sans-serif" font-weight="500" font-size="13" fill="#FFFFFF">Standby</text>
    </g>
  </g>

  <!-- Right: Telemetry Indicators Row (X: 994..1216, Y: 76..102) -->
  <g transform="translate(994, 76)">
    <!-- Wi-Fi Glyph & Status -->
    <g transform="translate(0, 0)">
      <path d="M 4,6 A 14,14 0 0,1 22,6 M 7,10 A 9,9 0 0,1 19,10 M 10,14 A 4,4 0 0,1 16,14 M 13,18 A 1,1 0 1,1 13,18.01" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      <text x="30" y="16" font-family="Roboto, sans-serif" font-weight="500" font-size="13" fill="#E5EAF5">Wi-Fi Forte</text>
    </g>
    <!-- Audio Status -->
    <g transform="translate(136, 0)">
      <path d="M 4,8 L 8,8 L 13,4 L 13,20 L 8,16 L 4,16 Z" fill="none" stroke="#FFA726" stroke-width="1.8"/>
      <line x1="16" y1="8" x2="22" y2="16" stroke="#FFA726" stroke-width="1.8"/>
      <line x1="22" y1="8" x2="16" y2="16" stroke="#FFA726" stroke-width="1.8"/>
      <text x="28" y="16" font-family="Roboto, sans-serif" font-weight="500" font-size="13" fill="#E5EAF5">0 / 100</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 3. REDESIGNED WEATHER CARD (Exact Bounds: X: 904..1216, Y: 272..360, 312×88dp) -->
  <!-- ========================================================================= -->
  <g transform="translate(904, 272)" id="weather_box">
    <!-- Base Glass Surface -->
    <rect width="312" height="88" rx="16" fill="url(#weatherGlassDark)" stroke="url(#frostedBorder)" stroke-width="1.2"/>

    <!-- Specular Top Rim -->
    <path d="M 16,1 L 296,1" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="0.8" stroke-linecap="round"/>

    <!-- === LEFT COMPARTMENT (Condição & Ícone: X: 0..142) === -->
    <!-- Condition Label (Top-Left: 12sp Roboto Medium) -->
    <text x="14" y="24" font-family="Roboto, sans-serif" font-weight="500" font-size="12" fill="#E2E8F0" letter-spacing="0.2">Nublado</text>

    <!-- Weather Glyph: Dual Overlapping Soft Clouds (42×42dp area) -->
    <g transform="translate(44, 32)">
      <!-- Back Cloud -->
      <path d="M 18,22 C 16,22 14,20 14,18 C 14,15.5 16,13.5 18.5,13.5 C 19.5,10.5 22.5,8.5 25.5,8.5 C 28.5,8.5 31,10 32,11.5 C 33,11.2 34,11 35,11 C 37.5,11 39.5,13 39.5,15.5 C 39.5,16 39.4,16.5 39.2,17 C 41,18 42,19.5 42,21.5 C 42,24 40,26 37.5,26 L 18,26 Z" fill="#90A4AE" fill-opacity="0.5"/>
      <!-- Front Cloud -->
      <path d="M 8,36 C 4,36 1,32.5 1,28 C 1,24 4,20.5 8,20.2 C 9.5,15 14.5,11 20.5,11 C 25,11 29,13.5 30.5,17.5 C 31.5,17.2 32.5,17 33.5,17 C 37.5,17 40.5,20 40.5,24 C 40.5,25 40.3,25.8 40,26.5 C 42.5,28 44,30.5 44,33.5 C 44,37 41,40 37.5,40 L 8,40 Z" fill="#ECEFF1"/>
    </g>

    <!-- === DISCRETE VERTICAL DIVIDER (X: 142) === -->
    <line x1="142" y1="12" x2="142" y2="76" stroke="url(#dividerGrad)" stroke-width="1"/>

    <!-- === RIGHT COMPARTMENT (Cidade, Temp, Atribuição: X: 154..312) === -->
    <!-- City Name (Top-Right: 12sp Roboto Medium) -->
    <text x="154" y="24" font-family="Roboto, sans-serif" font-weight="500" font-size="12" fill="#90A4AE" letter-spacing="0.3">Joinville, SC</text>

    <!-- Current Temperature (Center-Right: 34sp displayTypeface) -->
    <text x="154" y="58" font-family="Roboto, sans-serif" font-weight="400" font-size="34" fill="#FFFFFF" letter-spacing="-0.5" filter="url(#textDropShadow)">24°C</text>

    <!-- Open-Meteo Legal Attribution (Bottom-Right: 8sp Roboto Regular) -->
    <text x="154" y="76" font-family="Roboto, sans-serif" font-weight="400" font-size="8" fill="#64748B" letter-spacing="0.2">Clima: Open-Meteo · CC BY 4.0</text>
  </g>

  <!-- Right: PhilcoOS Brand & HDMI Status (X: 1216 right aligned, Y: 430) -->
  <g transform="translate(1216, 430)">
    <text x="0" y="0" font-family="Roboto, sans-serif" font-weight="500" font-size="13" fill="#DDEEF2" text-anchor="end" letter-spacing="0.8" filter="url(#textDropShadow)">PHILCO  /  ULTRA 777    •    HDMI 2 ATIVA</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 4. PRIMARY APPLICATION DOCK (Bottom Area: Y: 535..685, 8 Tiles)           -->
  <!-- ========================================================================= -->
  <!-- 8 Tiles: 124×134dp, 20dp gap. Total width: 1132dp. Margin: (1280 - 1132)/2 = 74px -->
  <g transform="translate(74, 535)">
    <!-- Tile 1: SmartTube (FOCUSED 1.045x / Cyan Glow) -->
    <g transform="translate(0, -4)">
      <rect width="124" height="134" rx="18" fill="url(#dockTileFocused)" stroke="#00E5FF" stroke-width="2.5" filter="url(#cyanGlow)"/>
      <!-- YouTube Play Glyph -->
      <polygon points="52,42 52,66 74,54" fill="#FF5252"/>
      <text x="62" y="96" font-family="Roboto, sans-serif" font-weight="500" font-size="13" fill="#FFFFFF" text-anchor="middle">SmartTube</text>
      <text x="62" y="112" font-family="Roboto, sans-serif" font-size="11" fill="#80DEEA" text-anchor="middle">YouTube</text>
    </g>

    <!-- Tile 2: TV Aberta (AR 27) -->
    <g transform="translate(144, 0)">
      <rect width="124" height="134" rx="18" fill="url(#dockTileGlass)" stroke="url(#frostedBorder)" stroke-width="1.2"/>
      <path d="M 52,40 A 14,14 0 0,1 72,40 M 56,46 A 8,8 0 0,1 68,46 M 62,50 L 62,68" fill="none" stroke="#80DEEA" stroke-width="2.2" stroke-linecap="round"/>
      <text x="62" y="96" font-family="Roboto, sans-serif" font-weight="500" font-size="13" fill="#E2E8F0" text-anchor="middle">AR</text>
      <text x="62" y="112" font-family="Roboto, sans-serif" font-size="11" fill="#78909C" text-anchor="middle">TV aberta</text>
    </g>

    <!-- Tile 3: Cabo (Cable 1) -->
    <g transform="translate(288, 0)">
      <rect width="124" height="134" rx="18" fill="url(#dockTileGlass)" stroke="url(#frostedBorder)" stroke-width="1.2"/>
      <rect x="44" y="44" width="36" height="24" rx="4" fill="none" stroke="#70E6CF" stroke-width="2"/>
      <path d="M 50,44 L 56,36 L 68,36 L 74,44" fill="none" stroke="#70E6CF" stroke-width="2"/>
      <text x="62" y="96" font-family="Roboto, sans-serif" font-weight="500" font-size="13" fill="#E2E8F0" text-anchor="middle">Cabo</text>
      <text x="62" y="112" font-family="Roboto, sans-serif" font-size="11" fill="#78909C" text-anchor="middle">TV a cabo</text>
    </g>

    <!-- Tile 4: AV Composto (AV 5) -->
    <g transform="translate(432, 0)">
      <rect width="124" height="134" rx="18" fill="url(#dockTileGlass)" stroke="url(#frostedBorder)" stroke-width="1.2"/>
      <!-- RCA Tri-color Jacks -->
      <circle cx="50" cy="54" r="6" fill="#FDD835"/>
      <circle cx="62" cy="54" r="6" fill="#E53935"/>
      <circle cx="74" cy="54" r="6" fill="#FFFFFF"/>
      <text x="62" y="96" font-family="Roboto, sans-serif" font-weight="500" font-size="13" fill="#E2E8F0" text-anchor="middle">AV</text>
      <text x="62" y="112" font-family="Roboto, sans-serif" font-size="11" fill="#78909C" text-anchor="middle">Composto</text>
    </g>

    <!-- Tile 5: HDMI 1 (Input 18) -->
    <g transform="translate(576, 0)">
      <rect width="124" height="134" rx="18" fill="url(#dockTileGlass)" stroke="url(#frostedBorder)" stroke-width="1.2"/>
      <path d="M 48,46 L 76,46 L 74,64 L 50,64 Z" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <text x="62" y="40" font-family="Roboto, sans-serif" font-size="10" fill="#00E5FF" text-anchor="middle">1</text>
      <text x="62" y="96" font-family="Roboto, sans-serif" font-weight="500" font-size="13" fill="#E2E8F0" text-anchor="middle">HDMI 1</text>
      <text x="62" y="112" font-family="Roboto, sans-serif" font-size="11" fill="#78909C" text-anchor="middle">Entrada 1</text>
    </g>

    <!-- Tile 6: HDMI 2 (Input 17 / Active) -->
    <g transform="translate(720, 0)">
      <rect width="124" height="134" rx="18" fill="url(#dockTileGlass)" stroke="url(#frostedBorder)" stroke-width="1.2"/>
      <path d="M 48,46 L 76,46 L 74,64 L 50,64 Z" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <text x="62" y="40" font-family="Roboto, sans-serif" font-size="10" fill="#00E5FF" text-anchor="middle">2</text>
      <text x="62" y="96" font-family="Roboto, sans-serif" font-weight="500" font-size="13" fill="#E2E8F0" text-anchor="middle">HDMI 2</text>
      <text x="62" y="112" font-family="Roboto, sans-serif" font-size="11" fill="#78909C" text-anchor="middle">Entrada 2</text>
    </g>

    <!-- Tile 7: Apps (App Drawer) -->
    <g transform="translate(864, 0)">
      <rect width="124" height="134" rx="18" fill="url(#dockTileGlass)" stroke="url(#frostedBorder)" stroke-width="1.2"/>
      <rect x="48" y="44" width="7" height="7" rx="1.5" fill="#E91E63"/>
      <rect x="58" y="44" width="7" height="7" rx="1.5" fill="#4CAF50"/>
      <rect x="68" y="44" width="7" height="7" rx="1.5" fill="#2196F3"/>
      <rect x="48" y="54" width="7" height="7" rx="1.5" fill="#FFC107"/>
      <rect x="58" y="54" width="7" height="7" rx="1.5" fill="#9C27B0"/>
      <rect x="68" y="54" width="7" height="7" rx="1.5" fill="#00BCD4"/>
      <text x="62" y="96" font-family="Roboto, sans-serif" font-weight="500" font-size="13" fill="#E2E8F0" text-anchor="middle">Apps</text>
      <text x="62" y="112" font-family="Roboto, sans-serif" font-size="11" fill="#78909C" text-anchor="middle">Sistema</text>
    </g>

    <!-- Tile 8: Ajustes (Settings) -->
    <g transform="translate(1008, 0)">
      <rect width="124" height="134" rx="18" fill="url(#dockTileGlass)" stroke="url(#frostedBorder)" stroke-width="1.2"/>
      <circle cx="62" cy="54" r="12" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <circle cx="62" cy="54" r="5" fill="#FFFFFF"/>
      <text x="62" y="96" font-family="Roboto, sans-serif" font-weight="500" font-size="13" fill="#E2E8F0" text-anchor="middle">Ajustes</text>
      <text x="62" y="112" font-family="Roboto, sans-serif" font-size="11" fill="#78909C" text-anchor="middle">Sistema</text>
    </g>
  </g>

  <!-- 5. Bottom-Left Mute Overlay Indicator -->
  <g transform="translate(38, 618)">
    <rect width="68" height="68" rx="18" fill="#141E2D" fill-opacity="0.88" stroke="#25354A" stroke-width="1.2"/>
    <path d="M 22,28 L 30,28 L 38,20 L 38,48 L 30,40 L 22,40 Z" fill="none" stroke="#80DEEA" stroke-width="2"/>
    <line x1="42" y1="26" x2="52" y2="42" stroke="#80DEEA" stroke-width="2" stroke-linecap="round"/>
    <line x1="52" y1="26" x2="42" y2="42" stroke="#80DEEA" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
