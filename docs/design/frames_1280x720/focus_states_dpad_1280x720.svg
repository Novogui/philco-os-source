<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060B14"/>
      <stop offset="100%" stop-color="#0B1324"/>
    </linearGradient>

    <!-- Normal State Surface -->
    <linearGradient id="cardNormal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Focused State Surface -->
    <linearGradient id="cardFocused" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.14"/>
    </linearGradient>

    <!-- Pressed State Surface -->
    <linearGradient id="cardPressed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.20"/>
    </linearGradient>

    <linearGradient id="rimNormal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Title & Specification Header -->
  <g transform="translate(64, 48)">
    <text x="0" y="28" font-family="Roboto, sans-serif" font-weight="700" font-size="28" fill="#FFFFFF">Especificação do Focus Engine D-pad — Glass &amp; Aurora 2.0</text>
    <text x="0" y="56" font-family="Roboto, sans-serif" font-size="15" fill="#80DEEA">Transições táteis sem overhead de GPU • Fator de Escala Contido: 1.045x (Anti-Overscan Clipping)</text>
  </g>

  <!-- Side-by-Side Comparison of States (X: 100, 480, 860) -->

  <!-- 1. ESTADO NORMAL (DESFOCADO / REPOUSO) -->
  <g transform="translate(100, 160)">
    <rect width="300" height="320" rx="20" fill="#0E172A" stroke="#1E293B" stroke-width="1.5"/>
    <text x="150" y="38" font-family="Roboto, sans-serif" font-weight="700" font-size="17" fill="#94A3B8" text-anchor="middle">1. ESTADO NORMAL (1.0x)</text>

    <!-- Normal Tile Representation -->
    <g transform="translate(88, 70)">
      <rect width="124" height="134" rx="18" fill="url(#cardNormal)" stroke="url(#rimNormal)" stroke-width="1.5"/>
      <!-- HDMI Glyph (Muted) -->
      <rect x="42" y="38" width="40" height="24" rx="3" fill="none" stroke="#90A4AE" stroke-width="2"/>
      <path d="M 46,44 L 46,56 M 54,44 L 54,56 M 62,44 L 62,56 M 70,44 L 70,56 M 78,44 L 78,56" stroke="#90A4AE" stroke-width="1.5"/>
      <text x="62" y="98" font-family="Roboto, sans-serif" font-weight="500" font-size="14" fill="#B0BEC5" text-anchor="middle">HDMI 2</text>
      <text x="62" y="116" font-family="Roboto, sans-serif" font-size="11" fill="#607D8B" text-anchor="middle">Inativo</text>
    </g>

    <text x="24" y="240" font-family="Roboto, sans-serif" font-size="13" fill="#E2E8F0">• Superfície: rgba(255,255,255, 0.08)</text>
    <text x="24" y="262" font-family="Roboto, sans-serif" font-size="13" fill="#E2E8F0">• Borda fosca: 1.5dp rgba(255,255,255, 0.16)</text>
    <text x="24" y="284" font-family="Roboto, sans-serif" font-size="13" fill="#E2E8F0">• Escala: 1.00x exato</text>
    <text x="24" y="304" font-family="Roboto, sans-serif" font-size="13" fill="#94A3B8">• Opacidade do rótulo: 70%</text>
  </g>

  <!-- 2. ESTADO FOCADO (D-PAD HOVER ATIVO) -->
  <g transform="translate(480, 140)">
    <rect width="320" height="350" rx="22" fill="#0C1B33" stroke="#00E5FF" stroke-width="2"/>
    <text x="160" y="38" font-family="Roboto, sans-serif" font-weight="700" font-size="17" fill="#00E5FF" text-anchor="middle">2. ESTADO FOCADO (1.045x)</text>

    <!-- Focused Tile Representation with Halo -->
    <g transform="translate(96, 68)">
      <!-- Outer Cyan Glow -->
      <rect x="-4" y="-4" width="136" height="146" rx="24" fill="#00E5FF" fill-opacity="0.25"/>
      <!-- Focused Surface -->
      <rect width="128" height="138" rx="20" fill="url(#cardFocused)" stroke="#00E5FF" stroke-width="2.5"/>
      <!-- Glyph Active -->
      <rect x="44" y="38" width="40" height="24" rx="3" fill="none" stroke="#00E5FF" stroke-width="2.4"/>
      <path d="M 48,44 L 48,56 M 56,44 L 56,56 M 64,44 L 64,56 M 72,44 L 72,56 M 80,44 L 80,56" stroke="#00E5FF" stroke-width="1.6"/>
      <text x="64" y="100" font-family="Roboto, sans-serif" font-weight="700" font-size="15" fill="#FFFFFF" text-anchor="middle">HDMI 2</text>
      <text x="64" y="120" font-family="Roboto, sans-serif" font-weight="500" font-size="12" fill="#80DEEA" text-anchor="middle">● Selecionado</text>
    </g>

    <text x="24" y="245" font-family="Roboto, sans-serif" font-size="13" fill="#E2E8F0">• Superfície: rgba(255,255,255, 0.22)</text>
    <text x="24" y="267" font-family="Roboto, sans-serif" font-size="13" fill="#E2E8F0">• Anel de Foco: 2.5dp Ciano (#00E5FF)</text>
    <text x="24" y="289" font-family="Roboto, sans-serif" font-size="13" fill="#E2E8F0">• Halo Externo: Glow de elevação sutil</text>
    <text x="24" y="311" font-family="Roboto, sans-serif" font-size="13" fill="#E2E8F0">• Escala: 1.045x (corrigido do 1.12x original)</text>
    <text x="24" y="331" font-family="Roboto, sans-serif" font-size="13" fill="#80DEEA">• Texto: 100% Branco com peso 700</text>
  </g>

  <!-- 3. ESTADO PRESSIONADO / DISPARO (ENTER / OK) -->
  <g transform="translate(870, 160)">
    <rect width="300" height="320" rx="20" fill="#0E172A" stroke="#1E293B" stroke-width="1.5"/>
    <text x="150" y="38" font-family="Roboto, sans-serif" font-weight="700" font-size="17" fill="#E0E0E0" text-anchor="middle">3. PRESSIONADO (1.02x)</text>

    <!-- Pressed Tile Representation (Tactile Compression) -->
    <g transform="translate(88, 74)">
      <rect width="124" height="134" rx="18" fill="url(#cardPressed)" stroke="#00B0FF" stroke-width="2.8"/>
      <!-- Glyph Compressed -->
      <rect x="42" y="38" width="40" height="24" rx="3" fill="none" stroke="#FFFFFF" stroke-width="2.6"/>
      <path d="M 46,44 L 46,56 M 54,44 L 54,56 M 62,44 L 62,56 M 70,44 L 70,56 M 78,44 L 78,56" stroke="#FFFFFF" stroke-width="2"/>
      <text x="62" y="98" font-family="Roboto, sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle">HDMI 2</text>
      <text x="62" y="116" font-family="Roboto, sans-serif" font-size="11" fill="#E0E0E0" text-anchor="middle">Carregando...</text>
    </g>

    <text x="24" y="240" font-family="Roboto, sans-serif" font-size="13" fill="#E2E8F0">• Superfície: rgba(255,255,255, 0.35)</text>
    <text x="24" y="262" font-family="Roboto, sans-serif" font-size="13" fill="#E2E8F0">• Compressão tátil: 1.045x → 1.02x</text>
    <text x="24" y="284" font-family="Roboto, sans-serif" font-size="13" fill="#E2E8F0">• Duração: 90ms antes de disparar Intent</text>
    <text x="24" y="304" font-family="Roboto, sans-serif" font-size="13" fill="#94A3B8">• Feedback visual imediato ao clique</text>
  </g>

  <!-- Implementation Notes Box (Bottom) -->
  <g transform="translate(100, 520)">
    <rect width="1070" height="150" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
    <text x="28" y="34" font-family="Roboto, sans-serif" font-weight="700" font-size="16" fill="#38BDF8">Requisitos de Implementação para o Codex (Zero-Cost onDraw Guarantee):</text>
    <text x="28" y="64" font-family="Roboto, sans-serif" font-size="13" fill="#CBD5E1">1. Não instanciar objetos Paint, Path ou ColorFilter dentro de onDraw() ou em callbacks de animação.</text>
    <text x="28" y="88" font-family="Roboto, sans-serif" font-size="13" fill="#CBD5E1">2. Utilizar ScaleAnimation ou View.setScaleX/setScaleY com hardware layers ativados temporariamente.</text>
    <text x="28" y="112" font-family="Roboto, sans-serif" font-size="13" fill="#CBD5E1">3. A escala 1.045x foi validada no artefato QC03 sem corte de bordas na resolução 1280×720.</text>
  </g>
</svg>
