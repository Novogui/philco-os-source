<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <!-- Background Gradient (Aurora Backdrop fallback) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060B14"/>
      <stop offset="50%" stop-color="#0B1324"/>
      <stop offset="100%" stop-color="#080E1A"/>
    </linearGradient>

    <!-- Aurora Atmospheric Glow -->
    <radialGradient id="auroraGlow" cx="20%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#1A73E8" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#7B1FA2" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass Surface Gradient (Card Base) -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Glass Surface Gradient (Focused Card) -->
    <linearGradient id="glassFocused" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.16"/>
    </linearGradient>

    <!-- Weather Card Glass (Dark Glass to preserve contrast over photo wallpapers) -->
    <linearGradient id="weatherGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B1220" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#060B14" stop-opacity="0.82"/>
    </linearGradient>

    <!-- Frosted Border Normal -->
    <linearGradient id="frostBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Vignette Shadow Overlay -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="40%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.65"/>
    </radialGradient>
  </defs>

  <!-- 1. Background Canvas -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  <rect width="1280" height="720" fill="url(#auroraGlow)"/>
  <rect width="1280" height="720" fill="url(#vignette)"/>

  <!-- 2. Header Information Area (Top Safe Margin: 48px, Left: 64px, Right: 64px) -->
  <!-- Digital Clock & Date Header -->
  <g transform="translate(64, 52)">
    <!-- Clock (Roboto Medium 90sp / ~72px) -->
    <text x="0" y="68" font-family="Roboto, sans-serif" font-weight="500" font-size="74" fill="#FFFFFF" letter-spacing="-1">05:45</text>
    <!-- Date (Roboto Regular 18sp / ~18px) -->
    <text x="4" y="98" font-family="Roboto, sans-serif" font-weight="400" font-size="18" fill="#B0BEC5">Sexta-feira, 21 de Novembro</text>
  </g>

  <!-- Telemetry & Brand Emblem (Top Right) -->
  <g transform="translate(1020, 52)">
    <!-- Wi-Fi Status Glyph & Text -->
    <g transform="translate(0, 16)">
      <path d="M 0,6 A 16,16 0 0,1 24,6 M 4,11 A 11,11 0 0,1 20,11 M 8,16 A 6,6 0 0,1 16,16 M 12,20 A 1,1 0 1,1 12,20.01" fill="none" stroke="#80DEEA" stroke-width="2.2" stroke-linecap="round"/>
      <text x="32" y="16" font-family="Roboto, sans-serif" font-size="14" fill="#80DEEA">Conectado</text>
    </g>
    <!-- PhilcoOS Ultra 777 Badge -->
    <rect x="130" y="8" width="66" height="22" rx="11" fill="#1A73E8" fill-opacity="0.25" stroke="#1A73E8" stroke-opacity="0.5" stroke-width="1"/>
    <text x="144" y="24" font-family="Roboto, sans-serif" font-weight="700" font-size="11" fill="#00E5FF" letter-spacing="1">777</text>
    <text x="0" y="46" font-family="Roboto, sans-serif" font-size="13" fill="#78909C">HDMI 2 • 1080p @ 60Hz</text>
  </g>

  <!-- Weather Card (104dp height, X: 64, Y: 180, Width: 320, Height: 94) -->
  <g transform="translate(64, 180)">
    <rect width="320" height="94" rx="18" fill="url(#weatherGlass)" stroke="url(#frostBorder)" stroke-width="1.5"/>
    <!-- Weather Glyph: Partly Cloudy Day -->
    <g transform="translate(24, 24)">
      <!-- Sun -->
      <circle cx="22" cy="18" r="11" fill="#FFB300"/>
      <!-- Cloud -->
      <path d="M 16,42 C 10,42 6,37 6,32 C 6,27 10,24 14,24 C 16,17 23,14 29,17 C 34,14 41,18 41,24 C 45,24 49,27 49,32 C 49,37 45,42 40,42 Z" fill="#ECEFF1" fill-opacity="0.95"/>
    </g>
    <!-- Weather Details -->
    <text x="88" y="44" font-family="Roboto, sans-serif" font-weight="500" font-size="34" fill="#FFFFFF">21°</text>
    <text x="146" y="38" font-family="Roboto, sans-serif" font-weight="400" font-size="15" fill="#E0E0E0">Parcialmente nublado</text>
    <text x="88" y="66" font-family="Roboto, sans-serif" font-weight="400" font-size="13" fill="#90A4AE">Joinville, SC • Open-Meteo</text>
  </g>

  <!-- 3. Center Atmospheric Breathing Room (Middle 240px: Wallpaper space) -->

  <!-- 4. Primary Application Dock (8 Cards: X: 64 to 1216, Y: 490, Height: 154) -->
  <!-- Card dimensions: 124px width, 134px height, gap: 20px. 8 cards = 8 * 124 + 7 * 20 = 992 + 140 = 1132px. Centered in 1280 -> Margin = (1280 - 1132)/2 = 74px -->
  <g transform="translate(74, 490)">
    <!-- Tile 1: Live TV (AR 27) -->
    <g transform="translate(0, 10)">
      <rect width="124" height="134" rx="18" fill="url(#glassCard)" stroke="url(#frostBorder)" stroke-width="1.5"/>
      <!-- TV Glyph -->
      <rect x="42" y="36" width="40" height="28" rx="4" fill="none" stroke="#FFFFFF" stroke-width="2.2"/>
      <path d="M 52,24 L 62,36 L 72,24 M 50,64 L 74,64" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
      <text x="62" y="98" font-family="Roboto, sans-serif" font-weight="500" font-size="14" fill="#E0E0E0" text-anchor="middle">TV Aberta</text>
      <text x="62" y="116" font-family="Roboto, sans-serif" font-size="11" fill="#78909C" text-anchor="middle">Canal 27</text>
    </g>

    <!-- Tile 2: Cabo (1) -->
    <g transform="translate(144, 10)">
      <rect width="124" height="134" rx="18" fill="url(#glassCard)" stroke="url(#frostBorder)" stroke-width="1.5"/>
      <path d="M 44,48 L 80,48 M 50,40 L 50,56 M 74,40 L 74,56" stroke="#4FC3F7" stroke-width="2.5" stroke-linecap="round"/>
      <text x="62" y="98" font-family="Roboto, sans-serif" font-weight="500" font-size="14" fill="#E0E0E0" text-anchor="middle">Cabo</text>
      <text x="62" y="116" font-family="Roboto, sans-serif" font-size="11" fill="#78909C" text-anchor="middle">CATV</text>
    </g>

    <!-- Tile 3: AV Composto (5) -->
    <g transform="translate(288, 10)">
      <rect width="124" height="134" rx="18" fill="url(#glassCard)" stroke="url(#frostBorder)" stroke-width="1.5"/>
      <!-- RCA Trio (Yellow, White, Red) -->
      <circle cx="48" cy="46" r="8" fill="#FDD835" stroke="#FFFFFF" stroke-width="1.5"/>
      <circle cx="62" cy="46" r="8" fill="#ECEFF1" stroke="#FFFFFF" stroke-width="1.5"/>
      <circle cx="76" cy="46" r="8" fill="#E53935" stroke="#FFFFFF" stroke-width="1.5"/>
      <text x="62" y="98" font-family="Roboto, sans-serif" font-weight="500" font-size="14" fill="#E0E0E0" text-anchor="middle">AV</text>
      <text x="62" y="116" font-family="Roboto, sans-serif" font-size="11" fill="#78909C" text-anchor="middle">RCA</text>
    </g>

    <!-- Tile 4: HDMI 1 (18) -->
    <g transform="translate(432, 10)">
      <rect width="124" height="134" rx="18" fill="url(#glassCard)" stroke="url(#frostBorder)" stroke-width="1.5"/>
      <rect x="42" y="38" width="40" height="24" rx="3" fill="none" stroke="#81C784" stroke-width="2.2"/>
      <path d="M 46,44 L 46,56 M 54,44 L 54,56 M 62,44 L 62,56 M 70,44 L 70,56 M 78,44 L 78,56" stroke="#81C784" stroke-width="1.5"/>
      <text x="62" y="98" font-family="Roboto, sans-serif" font-weight="500" font-size="14" fill="#E0E0E0" text-anchor="middle">HDMI 1</text>
      <text x="62" y="116" font-family="Roboto, sans-serif" font-size="11" fill="#78909C" text-anchor="middle">Entrada 18</text>
    </g>

    <!-- Tile 5: HDMI 2 (17) [FOCUSED D-PAD STATE: Scale 1.045x, Glow & Cyan Rim] -->
    <g transform="translate(574, 4)">
      <!-- Outer Cyan Halo Glow -->
      <rect x="-3" y="-3" width="134" height="144" rx="22" fill="#00E5FF" fill-opacity="0.25"/>
      <!-- Focused Surface -->
      <rect width="128" height="138" rx="20" fill="url(#glassFocused)" stroke="#00E5FF" stroke-width="2.5"/>
      <!-- HDMI Glyph (Active Cyan) -->
      <rect x="44" y="38" width="40" height="24" rx="3" fill="none" stroke="#00E5FF" stroke-width="2.4"/>
      <path d="M 48,44 L 48,56 M 56,44 L 56,56 M 64,44 L 64,56 M 72,44 L 72,56 M 80,44 L 80,56" stroke="#00E5FF" stroke-width="1.6"/>
      <text x="64" y="100" font-family="Roboto, sans-serif" font-weight="700" font-size="15" fill="#FFFFFF" text-anchor="middle">HDMI 2</text>
      <text x="64" y="120" font-family="Roboto, sans-serif" font-weight="500" font-size="12" fill="#80DEEA" text-anchor="middle">● Ativo (17)</text>
    </g>

    <!-- Tile 6: SmartTube -->
    <g transform="translate(720, 10)">
      <rect width="124" height="134" rx="18" fill="url(#glassCard)" stroke="url(#frostBorder)" stroke-width="1.5"/>
      <!-- Play Button Glyph -->
      <rect x="38" y="36" width="48" height="30" rx="7" fill="#E53935"/>
      <polygon points="58,44 68,51 58,58" fill="#FFFFFF"/>
      <text x="62" y="98" font-family="Roboto, sans-serif" font-weight="500" font-size="14" fill="#E0E0E0" text-anchor="middle">SmartTube</text>
      <text x="62" y="116" font-family="Roboto, sans-serif" font-size="11" fill="#78909C" text-anchor="middle">32.80 Stable</text>
    </g>

    <!-- Tile 7: Aplicativos (Drawer) -->
    <g transform="translate(864, 10)">
      <rect width="124" height="134" rx="18" fill="url(#glassCard)" stroke="url(#frostBorder)" stroke-width="1.5"/>
      <!-- 3x3 Grid Apps Glyph -->
      <g transform="translate(48, 36)" fill="#BA68C8">
        <rect x="0" y="0" width="7" height="7" rx="1.5"/>
        <rect x="11" y="0" width="7" height="7" rx="1.5"/>
        <rect x="22" y="0" width="7" height="7" rx="1.5"/>
        <rect x="0" y="11" width="7" height="7" rx="1.5"/>
        <rect x="11" y="11" width="7" height="7" rx="1.5"/>
        <rect x="22" y="11" width="7" height="7" rx="1.5"/>
        <rect x="0" y="22" width="7" height="7" rx="1.5"/>
        <rect x="11" y="22" width="7" height="7" rx="1.5"/>
        <rect x="22" y="22" width="7" height="7" rx="1.5"/>
      </g>
      <text x="62" y="98" font-family="Roboto, sans-serif" font-weight="500" font-size="14" fill="#E0E0E0" text-anchor="middle">Apps</text>
      <text x="62" y="116" font-family="Roboto, sans-serif" font-size="11" fill="#78909C" text-anchor="middle">Biblioteca</text>
    </g>

    <!-- Tile 8: Configurações -->
    <g transform="translate(1008, 10)">
      <rect width="124" height="134" rx="18" fill="url(#glassCard)" stroke="url(#frostBorder)" stroke-width="1.5"/>
      <!-- Gear / Tune Glyph -->
      <circle cx="62" cy="50" r="8" fill="none" stroke="#FFB74D" stroke-width="2.5"/>
      <path d="M 62,34 L 62,38 M 62,62 L 62,66 M 46,50 L 50,50 M 74,50 L 78,50 M 51,39 L 54,42 M 70,58 L 73,61 M 51,61 L 54,58 M 70,42 L 73,39" stroke="#FFB74D" stroke-width="2.5" stroke-linecap="round"/>
      <text x="62" y="98" font-family="Roboto, sans-serif" font-weight="500" font-size="14" fill="#E0E0E0" text-anchor="middle">Ajustes</text>
      <text x="62" y="116" font-family="Roboto, sans-serif" font-size="11" fill="#78909C" text-anchor="middle">Sistema</text>
    </g>
  </g>
</svg>
